description: Material Bank is a B2B digital marketplace that lets architects, interior designers, and
  other design professionals search, sample, and specify building and design materials from 650+ brands
  across hundreds of categories through a single platform, with free overnight sample delivery. The platform
  provides project boards, brand collections, sustainability filters (EPDs, CDPH), and a manufacturer
  portal for brands. Backed by bain-capital-ventures and general-catalyst. This profile was surfaced from
  a VC portfolio and enriched by the API Evangelist pipeline; no public developer API surface was found.
